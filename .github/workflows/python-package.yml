# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions in Ubuntu 24.04, 26.04, arch/latest stable
        python-version: ["3.12", "3.14"]

    steps:
    - name: Checkout rdf-utils
      uses: actions/checkout@v7
      with:
        repository: minhnh/rdf-utils
        path: rdf-utils
        ref: v1.0.1
    - name: Checkout bdd-dsl
      uses: actions/checkout@v7
      with:
        repository: minhnh/bdd-dsl
        path: bdd-dsl
        ref: v1.0.0
    - name: Checkout scene-dsl
      uses: actions/checkout@v7
      with:
        repository: secorolab/scene-dsl
        path: scene-dsl
        ref: v1.0.0
    - name: Checkout robbdd
      uses: actions/checkout@v7
      with:
        path: robbdd
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff pytest
        if [ -f robbdd/requirements.txt ]; then pip install -r robbdd/requirements.txt; fi
    - name: Lint with ruff
      run: |
        ruff check robbdd/src robbdd/tests
    - name: Install package
      run: |
        pip install "./rdf-utils[all]" ./scene-dsl ./bdd-dsl ./robbdd
    - name: Test with pytest
      run: |
        pytest -q robbdd/tests
